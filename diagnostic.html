<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOO DAARI — Form Diagnostic</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:50px auto;padding:0 20px;color:#12241c;line-height:1.6}
  h1{font-size:20px}
  button{background:#0c3d2e;color:#fff;border:0;padding:13px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
  button:disabled{opacity:.6;cursor:default}
  #result{margin-top:24px;padding:16px 18px;border-radius:10px;font-size:14px;white-space:pre-wrap;word-break:break-word;display:none}
  .ok{background:#e5f7ef;border:1px solid #b7e3cb}
  .fail{background:#fdeeee;border:1px solid #f3c2c2}
  .pending{background:#f6f1e7;border:1px solid #e6ddcd}
  code{background:#f0f0f0;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
  <h1>FormSubmit diagnostic</h1>
  <p>This page is served from your real domain, so it tests the exact same request the booking form makes. Click the button, then send Claude everything shown below.</p>
  <button id="run">Run test now →</button>
  <div id="result"></div>

<script>
document.getElementById('run').addEventListener('click', async () => {
  const btn = document.getElementById('run');
  const box = document.getElementById('result');
  btn.disabled = true; btn.textContent = 'Testing…';
  box.style.display = 'block';
  box.className = 'pending';
  box.textContent = 'Sending test request to FormSubmit…';

  const payload = {
    name: 'Diagnostic Test',
    service: 'diagnostic',
    message: 'This is an automated diagnostic test, not a real booking.',
    page: window.location.href,
    createdAt: new Date().toISOString()
  };

  let statusLine = '';
  let bodyText = '';
  try {
    const res = await fetch('https://formsubmit.co/ajax/satishsk789@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    statusLine = 'HTTP status: ' + res.status + ' ' + res.statusText;
    try {
      const data = await res.json();
      bodyText = 'Response body:\n' + JSON.stringify(data, null, 2);
      if (res.ok && data.success !== false && data.success !== 'false') {
        box.className = 'ok';
        box.textContent = '✅ SUCCESS — FormSubmit accepted the request.\n\n' + statusLine + '\n' + bodyText + '\n\nCheck satishsk789@gmail.com for this test message. If it arrives, the real booking form should work too — try it again.';
      } else {
        box.className = 'fail';
        box.textContent = '❌ FormSubmit responded but reported failure.\n\n' + statusLine + '\n' + bodyText;
      }
    } catch (parseErr) {
      const raw = await res.clone().text().catch(()=> '(could not read body)');
      box.className = 'fail';
      box.textContent = '❌ Got a response but it was not valid JSON.\n\n' + statusLine + '\n\nRaw response:\n' + raw;
    }
  } catch (networkErr) {
    box.className = 'fail';
    box.textContent = '❌ The request itself failed before getting a response (network/CORS block).\n\nError: ' + networkErr.message + '\n\nOpen your browser DevTools → Network tab and try again to see if a request to formsubmit.co even appears.';
  }
  btn.disabled = false; btn.textContent = 'Run test again';
});
</script>
</body>
</html>
